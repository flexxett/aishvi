<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aishvi, ye tumhare liye 💗</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg1:#16082b;--bg2:#44103f;--ac:#ff4d8d;--ac2:#ffb36b;--tx:#fff0f6;--glass:rgba(255,255,255,.09);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed;color:var(--tx);font-family:Poppins,system-ui,-apple-system,sans-serif;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;width:60vmax;height:60vmax;border-radius:50%;filter:blur(90px);opacity:.38;z-index:-1;animation:blob 14s ease-in-out infinite alternate;pointer-events:none}
body::before{background:var(--ac);top:-22vmax;left:-22vmax}
body::after{background:#7a5cff;bottom:-26vmax;right:-22vmax;animation-delay:-7s}
@keyframes blob{to{transform:translate(12vmax,10vmax) scale(1.2)}}
#app{max-width:440px;margin:0 auto;padding:14px 16px 28px;min-height:100vh;display:flex;flex-direction:column;justify-content:center}
.top{display:flex;justify-content:space-between;font-size:.85rem;opacity:.85;margin-bottom:8px}
.script{font-family:"Dancing Script",cursive}
.bar{height:5px;background:rgba(255,255,255,.15);border-radius:9px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .5s;box-shadow:0 0 12px var(--ac)}
.card{background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.18);border-radius:26px;padding:22px 16px;min-height:470px;position:relative;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.card>p,.card>h2,.card>button{animation:up .6s both}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
p{margin:0;line-height:1.55;text-align:center}
.t{font-size:1.15rem;font-weight:600}
.hint{opacity:.65;font-size:.85rem}
h2{margin:0;font-family:"Dancing Script",cursive;font-size:2.6rem;text-align:center;background:linear-gradient(90deg,#ffd1e3,var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.2}
button{border:0;font:inherit;font-weight:600;color:#fff;padding:13px 28px;border-radius:99px;background:linear-gradient(90deg,var(--ac),#ff7a59);box-shadow:0 8px 24px rgba(255,77,141,.5);cursor:pointer}
button:active{transform:scale(.96)}
.next{margin:16px auto 0;display:block}
.next[hidden]{display:none}
.msg{min-height:3.3em;font-weight:600;color:#ffd1e3;font-size:1.05rem;text-align:center}
.big{font-size:5.5rem;cursor:pointer;filter:drop-shadow(0 0 22px var(--ac));animation:beat 1.4s ease-in-out infinite;transition:font-size .2s}
@keyframes beat{50%{transform:scale(1.1)}}
.row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.fall{position:fixed;top:-50px;font-size:1.9rem;pointer-events:none;z-index:99;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) translateX(40px) rotate(360deg)}}
.bs{position:fixed;pointer-events:none;z-index:99;font-size:1.4rem}
.fl{position:fixed;bottom:-30px;pointer-events:none;z-index:0;opacity:.5;animation:rise 9s linear forwards}
@keyframes rise{to{transform:translateY(-110vh) rotate(40deg);opacity:0}}
.rope{position:relative;width:5px;height:150px;background:linear-gradient(#e0a869,#8a5a2b);border-radius:3px}
.knob{position:absolute;left:50%;bottom:-20px;width:40px;height:40px;margin-left:-20px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,var(--ac));touch-action:none;cursor:grab;box-shadow:0 0 22px var(--ac)}
.sky{position:relative;width:100%;height:230px;border-radius:18px;background:rgba(0,0,0,.28)}
.sk{position:absolute;font-size:2.5rem;cursor:pointer;filter:grayscale(1) brightness(.8);transition:.4s}
.sk.on{filter:drop-shadow(0 0 12px gold);transform:scale(1.3)}
.bl{font-size:3.6rem;cursor:pointer;animation:bob 2.5s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-14px)}}
.sw{position:relative;width:280px;height:120px}
.sw>div{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:10px;text-align:center;background:linear-gradient(135deg,var(--ac),var(--ac2));border-radius:16px;font-weight:600}
.sw canvas{position:absolute;inset:0;border-radius:16px;touch-action:none;max-width:100%}
.flip{width:118px;height:120px;perspective:600px;cursor:pointer}
.flip div{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .6s}
.flip.on div{transform:rotateY(180deg)}
.flip span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;font-size:.88rem;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25)}
.flip span+span{transform:rotateY(180deg);background:linear-gradient(135deg,var(--ac),#ff7a59)}
input[type=range]{width:88%;accent-color:var(--ac)}
.prog{width:80%;height:14px;background:rgba(255,255,255,.18);border-radius:9px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2))}
.catch{position:absolute;bottom:-40px;font-size:2.2rem;cursor:pointer;animation:up2 4s linear forwards}
@keyframes up2{to{transform:translateY(-560px)}}
.ring{width:120px;height:170px;perspective:800px;margin:38px 0}
.spin{width:100%;height:100%;position:relative;transform-style:preserve-3d;animation:rot 16s linear infinite}
.spin img{position:absolute;inset:0;width:120px;height:170px;object-fit:cover;border-radius:12px;border:3px solid rgba(255,255,255,.92);box-shadow:0 0 26px rgba(255,77,141,.6)}
@keyframes rot{to{transform:rotateY(360deg)}}
.pol{position:relative;background:#fff;padding:9px 9px 46px;border-radius:6px;opacity:0;box-shadow:0 14px 40px rgba(0,0,0,.5)}
.pol img{display:block;width:210px;height:270px;object-fit:cover}
.pol b{position:absolute;left:8px;right:8px;bottom:6px;text-align:center;color:#4a1d33;font:700 1.1rem/1.1 "Dancing Script",cursive}
.pc{position:absolute;top:0;width:84px;height:106px;object-fit:cover;border-radius:10px;border:3px solid #fff;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.4);animation:drop 4s linear forwards}
@keyframes drop{from{transform:translateY(-130px) rotate(0)}to{transform:translateY(520px) rotate(540deg)}}
.letter{background:rgba(255,255,255,.1);border-radius:16px;padding:16px;line-height:1.7;font-size:1.2rem;min-height:230px;width:100%;font-family:"Dancing Script",cursive;font-weight:600;text-align:left}
.th{width:54px;height:54px;border-radius:50%;object-fit:cover;border:2px solid #fff;animation:pop .6s both}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
</style>
</head>
<body>
<div id="app">
  <div class="top"><span class="script" style="font-size:1.2rem">Aishvi ke liye 💗</span><span id="cn"></span></div>
  <div class="bar"><i id="pb"></i></div>
  <div class="card" id="stage"></div>
  <button class="next" id="nx" hidden>Aage chalo →</button>
</div>

function ready(){ nx.hidden = false; }
function fall(list, n){
  for(var i=0;i<n;i++){
    var e = document.createElement('div');
    e.className = 'fall'; e.textContent = list[i % list.length];
    e.style.left = Math.random()*95 + 'vw';
    e.style.animationDuration = (2.5 + Math.random()*2.5) + 's';
    e.style.animationDelay = (Math.random()*1.2) + 's';
    document.body.appendChild(e);
    setTimeout(function(x){ x.remove(); }, 6500, e);
  }
}
function burst(e, em, n){
  for(var i=0;i<n;i++){
    var d = document.createElement('div'); d.className = 'bs'; d.textContent = em;
    d.style.left = e.clientX + 'px'; d.style.top = e.clientY + 'px';
    document.body.appendChild(d);
    var a = Math.random()*6.28, r = 60 + Math.random()*90;
    d.animate([{transform:'translate(-50%,-50%) scale(1)',opacity:1},{transform:'translate(calc(-50% + ' + Math.cos(a)*r + 'px),calc(-50% + ' + Math.sin(a)*r + 'px)) scale(.3)',opacity:0}], {duration:900, easing:'ease-out'}).onfinish = (function(x){ return function(){ x.remove(); }; })(d);
  }
}

  function go(){ if(iv || done) return; iv = setInterval(function(){ v += 2; G('pg').style.width = v + '%'; if(v >= 100){ done = true; clearInterval(iv); b.textContent = 'Hug mil gaya 🤗💗'; fall(['🤗','💗'], 25); ready(); } }, 50); }
  function st(){ clearInterval(iv); iv = null; }
  b.oncontextmenu = function(){ return false; };
  b.onpointerdown = go; b.onpointerup = st; b.onpointerleave = st;
  timers.push({ c: st });
},
// 12 3D carousel
function(){
  var p = pics(), n = p.length, r = Math.max(130, Math.round(66/Math.tan(Math.PI/n)));
  $('<h2>Hamari yaadein</h2><div class="ring"><div class="spin" id="sp"></div></div><p class="hint">Dekho, kitni pyaari yaadein hain 📸</p>');
  p.forEach(function(s, i){ var e = document.createElement('img'); e.src = s; e.alt = ''; e.style.transform = 'rotateY(' + (i*360/n) + 'deg) translateZ(' + r + 'px)'; G('sp').appendChild(e); });
  setTimeout(ready, 4500);
},
// 13 photo show
function(){
  var p = pics(), i = 0, h = 'perspective(600px) ';
  function K(a, b, c){ return [{transform:a,opacity:0},{transform:b,opacity:1,offset:.22},{transform:b,opacity:1,offset:.78},{transform:c,opacity:0}]; }
  var A = [
    K('rotate(-720deg) scale(0)','rotate(0) scale(1)','rotate(720deg) scale(0)'),
    K(h+'rotateY(90deg)',h+'rotateY(0)',h+'rotateY(-90deg)'),
    K('translateY(-340px) rotate(-12deg)','translateY(0) rotate(-3deg)','translateY(340px) rotate(12deg)'),
    K('translateX(-340px) rotate(-360deg)','translateX(0) rotate(2deg)','translateX(340px) rotate(360deg)'),
    K('scale(3)','scale(1) rotate(-2deg)','scale(0) rotate(180deg)'),
    K(h+'rotateX(90deg)',h+'rotateX(0)',h+'rotateX(-90deg)')
  ];
  $('<div class="pol" id="sh"><img id="si" alt=""><b id="sc"></b></div>');
  var total = Math.max(p.length, 6);
  function go(){
    G('si').src = p[i % p.length]; G('sc').textContent = CAP[i % CAP.length] || '';
    G('sh').animate(A[i % A.length], {duration:3000, fill:'forwards'});
    i++; if(i == total) ready();
  }
  go(); timers.push(setInterval(go, 3000));
},
// 14 photo rain
function(){
  var p = pics(), n = 0, k = 0;
  $('<p class="t">Girti photos pakdo (6) 🖼️</p><p class="msg" id="ct">0 / 6</p>');
  timers.push(setInterval(function(){
    if(k >= 12) return;
    var e = document.createElement('img'); e.className = 'pc'; e.src = p[k++ % p.length]; e.alt = '';
    e.style.left = (4 + Math.random()*72) + '%';
    e.onclick = function(ev){ e.remove(); burst(ev, '💗', 5); if(++n <= 6) G('ct').textContent = n + ' / 6'; if(n == 6) ready(); };
    stage.appendChild(e); setTimeout(function(){ e.remove(); }, 4100);
  }, 800));
},
// 15 letter
function(){
  var T = NAME + ',\nmujhe pata hai maine tumhe hurt kiya, aur is baat ka mujhe bahut afsos hai. Tumhare aansu mere liye sabse bada sabak hain. Tum meri zindagi ki sabse khaas insaan ho aur main tumhe kabhi takleef nahi dena chahta. Bas ek mauka do, main sab theek kar dunga.\n\n— ' + FROM + ' 💗';
  $('<p class="t">Ek chitthi tumhare naam ✉️</p><div class="letter" id="lt"></div>');
  var i = 0;
  timers.push(setInterval(function(){
    i++; G('lt').innerHTML = T.slice(0, i).replace(/\n/g, '<br>');
    if(i >= T.length){ ready(); }
  }, 28));
},
// 16 promise
function(){
  var p = pics();
  $('<h2>Meri Promise 💍</h2><p>' + NAME + ', main promise karta hu ki main tumhe dobara hurt nahi karunga. Tumhari izzat, tumhari feelings aur tumhari khushi mere liye hamesha sabse pehle hongi.</p><button id="pr">Haan, promise karta hu 🤞</button><div class="row" id="th" style="gap:8px"></div><p class="msg script" id="mg" style="font-size:1.5rem"></p>');
  G('pr').onclick = function(){
    this.style.display = 'none';
    p.forEach(function(s, i){ var e = document.createElement('img'); e.src = s; e.alt = ''; e.className = 'th'; e.style.animationDelay = (i*.15) + 's'; G('th').appendChild(e); });
    G('mg').innerHTML = 'Promise kar diya 💗<br>Please mujhe maaf kar do, ' + NAME + '.<br>— ' + FROM;
    fall(['🌸','🌹','💖','✨','🎉'], 70);
  };
}
];
function show(i){
  timers.forEach(function(t){ if(t.c) t.c(); else clearInterval(t); }); timers = [];
  stage.innerHTML = ''; nx.hidden = true;
  pb.style.width = ((i + 1)/acts.length*100) + '%'; cn.textContent = (i + 1) + ' / ' + acts.length;
  acts[i]();
}
nx.onclick = function(){ if(cur < acts.length - 1){ cur++; show(cur); } };
// intro
$('<div class="big" style="animation-duration:2s">💌</div><h2 style="font-size:3.6rem">' + NAME + '</h2><p>Ek chhoti si sorry,<br>tumhare liye bahut saari yaadon ke saath...</p><button id="go">Shuru karo ✨</button>');
G('go').onclick = function(){ fall(['💗','✨'], 15); show(0); };
